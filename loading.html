<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Redirect to index.html after 3 seconds -->
    <meta http-equiv="refresh" content="3;url=index.html">

    <title>Student Feedback System</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        /* ==========================================
           RESET
           ========================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            font-family: 'Poppins', sans-serif;
        }


        /* ==========================================
           BODY
           ========================================== */

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(249, 115, 22, 0.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(51, 65, 85, 0.18),
                    transparent 35%
                ),
                #121212;

            color: #F8FAFC;
        }


        /* ==========================================
           BACKGROUND GLOWS
           ========================================== */

        .glow {
            position: fixed;

            border-radius: 50%;

            pointer-events: none;

            filter: blur(100px);
        }

:root {
    --loader-bg: #F8FAFC;
    --loader-card: rgba(255, 255, 255, 0.70);
    --loader-text: #0F172A;
    --loader-muted: #64748B;
    --loader-bar-bg: rgba(249, 115, 22, 0.10);
}

[data-theme="dark"] {
    --loader-bg: #121212;
    --loader-card: rgba(31, 41, 55, 0.45);
    --loader-text: #F8FAFC;
    --loader-muted: #9CA3AF;
    --loader-bar-bg: rgba(255, 255, 255, 0.08);
}

body {
    background: var(--loader-bg);
}

.loader-box {
    background: var(--loader-card);
}

.loader-box h1 {
    color: var(--loader-text);
}

.loader-box p {
    color: var(--loader-muted);
}

.loading-bar {
    background: var(--loader-bar-bg);
}
        .glow-orange {
            width: 380px;
            height: 380px;

            top: -170px;
            left: -120px;

            background: #F97316;

            opacity: 0.25;

            animation: floatBlue 8s ease-in-out infinite alternate;
        }


        .glow-grey {
            width: 430px;
            height: 430px;

            right: -160px;
            bottom: -190px;

            background: #334155;

            opacity: 0.25;

            animation: floatPurple 9s ease-in-out infinite alternate;
        }


        /* ==========================================
           GLASS LOADER
           ========================================== */

        .loader-box {

            position: relative;

            width: 440px;

            max-width: 90%;

            padding: 45px 40px 38px;

            text-align: center;

            /* Glass */

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.10),
                    rgba(255, 255, 255, 0.03)
                );

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            border: 1px solid rgba(255, 255, 255, 0.12);

            border-radius: 22px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.35),
                inset 0 1px 1px rgba(255, 255, 255, 0.10);

            overflow: hidden;

            animation: cardAppear 0.8s ease;
        }


        /* ==========================================
           GLASS SHINE
           ========================================== */

        .loader-box::before {

            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 60%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 255, 255, 0.08),
                    transparent
                );

            transform: skewX(-20deg);

            animation: shine 3s ease-in-out infinite;
        }


        /* ==========================================
           TOP ACCENT
           ========================================== */

        .top-line {

            position: absolute;

            top: 0;
            left: 10%;

            width: 80%;
            height: 2px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #F97316,
                    #334155,
                    transparent
                );

            box-shadow:
                0 0 15px rgba(249, 115, 22, 0.7);
        }


        /* ==========================================
           LOGO / ICON
           ========================================== */

        .loader-icon {

            position: relative;

            width: 65px;
            height: 65px;

            margin: 0 auto 20px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #F97316,
                    #334155
                );

            box-shadow:
                0 8px 25px rgba(249, 115, 22, 0.35);

            animation: iconPulse 2s ease-in-out infinite;
        }


        .loader-icon::after {

            content: "";

            position: absolute;

            inset: -5px;

            border-radius: 22px;

            border: 1px solid rgba(253, 186, 116, 0.25);

            animation: iconRing 2s ease-in-out infinite;
        }


        .loader-icon span {

            font-size: 28px;

            color: white;
        }


        /* ==========================================
           TITLE
           ========================================== */

        .loader-box h1 {

            position: relative;

            font-size: 1.5rem;

            font-weight: 600;

            margin-bottom: 8px;

            background:
                linear-gradient(
                    135deg,
                    #FDBA74,
                    #64748B
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }


        /* ==========================================
           SUBTITLE
           ========================================== */

        .subtitle {

            position: relative;

            margin-bottom: 28px;

            color: #94A3B8;

            font-size: 0.8rem;
        }


        /* ==========================================
           LOADING BAR
           ========================================== */

        .loading-bar {

            position: relative;

            width: 100%;

            height: 9px;

            background: rgba(255, 255, 255, 0.07);

            border: 1px solid rgba(255, 255, 255, 0.05);

            border-radius: 20px;

            overflow: hidden;
        }


        /* ==========================================
           PROGRESS
           ========================================== */

        .loading-progress {

            width: 0%;

            height: 100%;

            border-radius: 20px;

            background:
                linear-gradient(
                    90deg,
                    #F97316,
                    #FB923C,
                    #FDBA74
                );

            box-shadow:
                0 0 12px rgba(249, 115, 22, 0.7),
                0 0 25px rgba(253, 186, 116, 0.4);

            animation:
                loading 3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }


        /* ==========================================
           LOADING STATUS
           ========================================== */

        .loading-status {

            margin-top: 15px;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 7px;

            color: #94A3B8;

            font-size: 0.78rem;
        }


        /* ==========================================
           ANIMATED DOTS
           ========================================== */

        .dots {

            display: flex;

            gap: 4px;
        }


        .dots span {

            width: 4px;
            height: 4px;

            border-radius: 50%;

            background: #FDBA74;

            animation: dots 1.2s infinite ease-in-out;
        }


        .dots span:nth-child(2) {
            animation-delay: 0.15s;
        }


        .dots span:nth-child(3) {
            animation-delay: 0.3s;
        }


        /* ==========================================
           ANIMATIONS
           ========================================== */

        @keyframes loading {

            0% {
                width: 0%;
            }

            100% {
                width: 100%;
            }

        }


        @keyframes cardAppear {

            from {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }


        @keyframes shine {

            0% {
                left: -100%;
            }

            60% {
                left: 140%;
            }

            100% {
                left: 140%;
            }

        }


        @keyframes iconPulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.04);
            }

        }


        @keyframes iconRing {

            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }

            50% {
                opacity: 0.7;
                transform: scale(1.08);
            }

        }


        @keyframes dots {

            0%,
            80%,
            100% {
                opacity: 0.25;
                transform: translateY(0);
            }

            40% {
                opacity: 1;
                transform: translateY(-3px);
            }

        }


        @keyframes floatBlue {

            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(50px, 40px);
            }

        }


        @keyframes floatPurple {

            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(-40px, -30px);
            }

        }


        /* ==========================================
           MOBILE
           ========================================== */

        @media (max-width: 500px) {

            .loader-box {
                width: 88%;

                padding: 35px 25px 30px;

                border-radius: 18px;
            }

            .loader-box h1 {
                font-size: 1.25rem;
            }

            .loader-icon {
                width: 58px;
                height: 58px;
            }

        }

    </style>

</head>


<body>


    <!-- Background -->

    <div class="glow glow-orange"></div>

    <div class="glow glow-grey"></div>


    <!-- Glass Loader -->

    <div class="loader-box">

        <div class="top-line"></div>


        <div class="loader-icon">
            <span>🎓</span>
        </div>


        <h1>
            Student Feedback System
        </h1>


        <p class="subtitle">
            Preparing your dashboard...
        </p>


        <div class="loading-bar">

            <div class="loading-progress"></div>

        </div>


        <div class="loading-status">

            <span>Loading</span>

            <div class="dots">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>

    </div>


</body>
<script>
    const savedTheme = localStorage.getItem('theme');

    if (savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
    }
</script>
</html>
